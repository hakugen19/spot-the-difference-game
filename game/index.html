<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot the Difference</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10131c; }
  #game { position: fixed; inset: 0; margin: auto; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Spot the Difference: click the spots where the right picture differs from the left"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
